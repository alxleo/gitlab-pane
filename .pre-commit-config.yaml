# The checks a commit has to pass, the same here and in CI.
# `pre-commit install` sets up all three kinds of hook below: before a commit, on its message, and before a push.
# CI runs `pre-commit run --all-files --hook-stage manual`: every commit-time check over the whole tree, and gitleaks
# over the whole history instead of the staged change.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]
exclude: ^(CHANGELOG\.md|tools/screens/fonts/.*)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-json
        exclude: ^tsconfig\.core\.json$ # carries a comment, which tsc allows and JSON does not
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--enforce-all] # also in CI, where nothing is staged
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Secrets: the staged change before each commit; every commit in CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in every commit
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [manual]

  # The workflows: actionlint for mistakes, zizmor for security (injection, over-broad tokens, unpinned actions).
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor

  # Releases are worked out from commit messages, so each one says what it is: `feat: …`, `fix(jira): …`.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # The plugin itself, with the Claude Code you have installed.
  - repo: local
    hooks:
      - id: plugin-validate
        name: claude plugin validate --strict
        entry: claude plugin validate --strict .
        language: system
        pass_filenames: false
        files: ^(\.claude-plugin|hooks|types)/
      - id: plugin-test
        name: claude plugin test
        entry: claude plugin test .
        language: system
        pass_filenames: false
        files: ^(\.claude-plugin|hooks|types|tests)/
        stages: [pre-push]
      # The declarations of the Claude Code on PATH (CI pins it), unpacked from its bundled skill into the git-ignored
      # .claude-plugin/types/, for the full tsc and the type-aware lint below. Needs no sign-in; does nothing when current.
      - id: engine-types
        name: Claude Code's declarations
        entry: node tools/engine_types.ts
        language: system
        pass_filenames: false
        always_run: true
      # The core (see tsconfig.core.json) type-checked alone, with the TypeScript pinned here so a release of it cannot
      # fail a commit nobody touched. It has no engine types, so a core file that imports the engine does not compile.
      - id: tsc-core
        name: tsc the core
        entry: tsc -p tsconfig.core.json
        language: node
        additional_dependencies: ['typescript@7.0.2']
        pass_filenames: false
        files: ^(hooks|types)/|^tests/(fixtures|gitlab_fake)\.ts$|^tsconfig\.core\.json$
      # Every file, against the engine's declarations: the engine-facing files and the tests the core check leaves out.
      - id: tsc
        name: tsc everything
        entry: tsc -p tsconfig.json
        language: node
        additional_dependencies: ['typescript@7.0.2']
        pass_filenames: false
        files: ^(hooks|types|tests|tools/screens)/|^tsconfig\.json$
      # The dev-only store probe is a plugin of its own, so the shipped plugin's compile does not take it in.
      - id: tsc-store-probe
        name: tsc the store probe
        entry: tsc -p tools/store-probe/tsconfig.json
        language: node
        additional_dependencies: ['typescript@7.0.2']
        pass_filenames: false
        files: ^tools/store-probe/
      # The types of GitLab's answers (hooks/gitlab.generated.ts) made again from the schema snapshot and the documents in
      # hooks/gitlab.ts, and compared: a query edited without regenerating fails here. No network but npm's first install.
      - id: gitlab-types
        name: GitLab types are what the snapshot and queries give
        entry: uv run --locked tools/gitlab_schema.py types --check
        language: system
        pass_filenames: false
        files: ^(hooks/gitlab(\.generated)?\.ts|tools/gitlab_queries\.ts|tools/gitlab_schema\.py(\.lock)?|tools/gitlab_schema\.snapshot\.json|tools/codegen/.*)$
      # What the compiler cannot state: no casts, `any`, lint-disable comments or module-level state, files kept short, the
      # core's imports, and the type-aware rules on every file. See eslint.config.cjs. The linter's own TypeScript is 6.0,
      # the newest typescript-eslint can load; the tsc hooks above are the ones that pin the compiler.
      - id: eslint
        name: eslint
        entry: eslint --max-warnings 0 hooks tests tools/screens tools/store-probe
        language: node
        additional_dependencies:
          - 'eslint@10.14.0'
          - 'typescript-eslint@8.72.1'
          - '@eslint-community/eslint-plugin-eslint-comments@4.8.1'
          - 'typescript@6.0.3'
        pass_filenames: false
        files: ^(hooks|tests|tools/screens|tools/store-probe)/.*\.tsx?$|^tools/eslint_rules\.cjs$|^eslint\.config\.cjs$|^tsconfig(\.core)?\.json$
