# Types of every query and fragment in hooks/gitlab.ts, against the part of GitLab's schema the pane uses. Run by
# tools/gitlab_schema.py from this folder, where the plugins are installed, and it sets the three paths; these are the defaults.
schema: ${GITLAB_SCHEMA:../gitlab_schema.snapshot.json}
documents: ${GITLAB_DOCS:../../hooks/gitlab.ts}
generates:
  ${GITLAB_TYPES:../../hooks/gitlab.generated.ts}:
    plugins:
      - typescript-operations
    config:
      # Types only (no runtime enums), and only the ones a query uses.
      enumsAsTypes: true
      skipTypename: true
      useTypeImports: true
      # A scalar not named below is `unknown`, so a new one cannot slip in as `any`.
      defaultScalarType: unknown
      scalars:
        ID: string
        Time: string
