# Keeps the pinned actions and pre-commit hooks current: one grouped pull request a month for each, and only for
# versions out for two weeks, so a hijacked release has time to be caught before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      hooks:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
