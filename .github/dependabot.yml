# Keeps the pinned actions and the dev-time npm packages current: one grouped pull request a month for each, and only for
# versions out for two weeks, so a hijacked release has time to be caught before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # The root package.json: the type-checkers, the linter, graphql-codegen, Playwright and the git hooks. The mod itself has
  # no npm packages. typescript-eslint cannot load TypeScript past 6.0, so `typescript` (the linter's) stays on 6.x while
  # `typescript-7` is the compiler that CI and the hooks run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      tooling:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
