# Keeps docs/screens/*.png, the README's pictures of the pane, true to what the pane draws.
# The work is one command, `uv run tools/pane_screens.py render`: it runs the mod's own drawing code under the pinned
# Claude Code and photographs the result in Chromium. This file only installs the tools, runs it, and commits the PNGs
# back when they changed. A move to GitLab CI keeps the same three steps.
#
# No loop: the workflow starts only for changes to what the pictures are made from, never for docs/screens itself, and
# a push made with GITHUB_TOKEN starts no workflow either.
name: screens
on:
  push:
    branches: [main, screens-spike]
    paths:
      - hooks/**
      - types/**
      - tests/fixtures.ts
      - tools/pane_screens.py
      - tools/screens/**
      - .claude-plugin/plugin.json
      - .github/workflows/screens.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screens:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: "2.1.308"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: uv run tools/pane_screens.py setup --with-deps
      # Draws every scene twice and fails unless the two sets of PNGs match byte for byte, so a push never churns them.
      - run: uv run tools/pane_screens.py render --verify
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: docs/screens/*.png
      - name: Commit the screenshots if they changed
        run: |
          git add docs/screens
          if git diff --cached --quiet; then
            echo "The screenshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate the pane screenshots [skip ci]"
          git push
