# Keeps docs/screens/*.png, the README's pictures of the pane, true to what the pane draws.
# The work is `uv run tools/pane_screens.py render`: it runs the mod's own drawing code under the pinned Claude Code and
# photographs the result in Chromium. `publish` then commits the PNGs when they changed and pushes them, even when the
# branch moved while they were drawn. This file only installs the tools and runs those two commands, so a move to GitLab
# CI keeps the same steps.
#
# No loop: the workflow starts only for changes to what the pictures are made from, never for docs/screens itself, and
# a push made with GITHUB_TOKEN starts no workflow either.
#
# The write token reaches one step. Checkout keeps no credentials, and the script's own packages are pinned by its lock file.
name: screens
on:
  push:
    branches: [main]
    paths:
      - hooks/**
      - types/**
      - tests/fixtures.ts
      - tools/pane_screens.py
      - tools/pane_screens.py.lock
      - tools/screens/**
      - .claude-plugin/plugin.json
      - .github/workflows/screens.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CLAUDE_CODE_VERSION: "2.1.318"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # zizmor: ignore[adhoc-packages] one pinned CLI
      - run: uv run --locked tools/pane_screens.py setup --with-deps
      # Draws every scene twice and fails unless the two sets of PNGs match byte for byte, so a push never churns them.
      - run: uv run --locked tools/pane_screens.py render --verify
      - name: Commit the screenshots if they changed
        env:
          PANE_SCREENS_PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: uv run --locked tools/pane_screens.py publish --branch "$GITHUB_REF_NAME"
