# Keeps docs/screens/*.png, the README's pictures of the pane, true to what the pane draws.
# The work is `npm run screens -- render --check`: it runs the mod's own drawing code under the pinned Claude Code,
# photographs the result in Chromium, and fails unless the committed PNGs are exactly those. A stale picture is regenerated
# by whoever changed the drawing (`npm run screens -- render`) and committed with the change: nothing here pushes a commit,
# so no head commit is left without checks. A failing run names each stale picture; render them locally to look at the
# difference. Nothing is uploaded: GitHub artifact storage is one small allowance shared by every repository in the account.
# This file only installs the tools and runs those commands, so a move to GitLab CI keeps the same steps.
#
# The job reads the repository and nothing more: checkout keeps no credentials and the packages are those of package-lock.json.
name: screens
on:
  push:
    branches: [main]
    paths:
      - hooks/**
      - types/**
      - tests/fixtures.ts
      - tests/gitlab_fake.ts
      - tools/pane_screens.ts
      - tools/screens/**
      - docs/screens/**
      - package-lock.json
      - .claude-plugin/plugin.json
      - .github/workflows/screens.yml
  pull_request:
    paths:
      - hooks/**
      - types/**
      - tests/fixtures.ts
      - tests/gitlab_fake.ts
      - tools/pane_screens.ts
      - tools/screens/**
      - docs/screens/**
      - package-lock.json
      - .claude-plugin/plugin.json
      - .github/workflows/screens.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: screens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: "2.1.318"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # zizmor: ignore[adhoc-packages] one pinned CLI
      - run: npm ci --ignore-scripts
      - run: npm run screens -- setup --with-deps
      # Draws every scene twice, fails unless the two sets match byte for byte, and fails unless docs/screens holds them.
      - run: npm run screens -- render --verify --check
