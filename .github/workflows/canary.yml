# Catches what breaks the pane while this repository stands still: a new Claude Code, or a change to GitLab's API.
# check.yml tests one pinned Claude Code, and the tests answer for GitLab with made-up data, so neither can see these.
#
# Every Monday it validates the plugin and runs its tests on the newest Claude Code, installs the plugin from GitHub into an
# empty setup as a teammate would, installs the release tree (tools/release_tree.ts) and checks that only the plugin's
# files arrive, checks that the release branch holds the latest released version once there is one, and checks every query the pane sends against gitlab.com's live schema
# (tools/gitlab_schema.ts), and that the schema snapshot and the generated types (hooks/gitlab.generated.ts) still match it.
# A failure opens an issue, or comments on the one already open, so it reaches whoever watches
# the repository; the next green run closes it. Renovate raises the pinned version in check.yml and screens.yml (see
# renovate.json); a failure here on the newest Claude Code warns before that pull request arrives.
#
# A pull request that changes the queries gets the schema check alone. GitHub turns schedules off in a public
# repository after 60 days without a commit; the Actions tab then offers to turn this back on.
name: canary
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - hooks/gitlab-documents.ts
      - hooks/gitlab.generated.ts
      - tools/gitlab_schema.snapshot.json
      - tools/gitlab_schema.ts
      - package.json
      - package-lock.json
      - .github/workflows/canary.yml

permissions: {}

concurrency:
  group: canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@latest # zizmor: ignore[adhoc-packages] the newest is the point
      - run: claude --version
      - run: claude plugin validate --strict .
      - run: claude plugin test .
      - name: Install from GitHub into an empty setup
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/fresh
        run: |
          claude plugin marketplace add "$GITHUB_REPOSITORY"
          claude plugin install gitlab-pane@gitlab-pane
          claude plugin list --json | jq -e '.[] | select(.id == "gitlab-pane@gitlab-pane") | .enabled'
      # What a team that pins `plugin-v<version>` gets: the tree's own marketplace, built here, installed from its folder.
      - name: Install the release tree, which holds the plugin's files and nothing else
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/tree-setup
        run: |
          node tools/release_tree.ts build "$RUNNER_TEMP/tree"
          claude plugin marketplace add "$RUNNER_TEMP/tree"
          claude plugin install gitlab-pane@gitlab-pane
          # The JSON, not the listing: the listing's lines change between versions (a folder install gained "Read from").
          plugin=$(claude plugin list --json | jq -e '.[] | select(.id == "gitlab-pane@gitlab-pane" and .enabled)')
          installed=$(jq -r .installPath <<< "$plugin")
          test -f "$installed/hooks/hooks.json"
          for dev in tools tests docs .github CONTRIBUTING.md release; do
            if [ -e "$installed/$dev" ]; then
              echo "::error::The installed plugin holds $dev, which is a development file"
              exit 1
            fi
          done
      # Once the first release has been published, the branch must hold the latest released tree.
      - name: The release branch holds the latest released version
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$url" refs/heads/release > /dev/null; then
            echo "::notice::Skipped: there is no release branch yet, because no release has been published since the publish job was added."
            exit 0
          fi
          latest=$(git ls-remote --tags --refs "$url" 'refs/tags/plugin-v*' | sed 's#.*refs/tags/plugin-v##' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::The release branch exists but no plugin-v* tag does"
            exit 1
          fi
          git clone --quiet --depth 1 --branch release "$url" "$RUNNER_TEMP/release"
          held=$(jq -r .version "$RUNNER_TEMP/release/.claude-plugin/plugin.json")
          if [ "$held" != "$latest" ]; then
            echo "::error::The release branch holds version $held, but the latest tag is plugin-v$latest"
            exit 1
          fi

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node runs tools/gitlab_schema.ts as it is, types stripped; graphql-codegen is in package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run schema -- check

  # The whole history, for secrets: check.yml's run reads what a pull request or a push brought, and a schedule reads everything.
  history:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  tell:
    needs: [latest, schema, history]
    # A cancelled run says nothing either way, so it neither opens nor closes the issue.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: Weekly canary failed
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - name: Open, add to or close the canary issue
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ "$FAILED" = true ] && [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN"
          elif [ "$FAILED" = true ]; then
            gh issue create --title "$TITLE" --body "The newest Claude Code or GitLab's schema no longer fits the pane. The run says which step: $RUN"
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Passing again: $RUN"
          fi
