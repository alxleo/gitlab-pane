# Everything a change has to pass: one job for the checks, because GitHub bills each job as at least a whole minute, so one
# job of 40 s costs one minute where three jobs of 15 s cost three, and one job for the scanners, which need no Node. It runs
# for pull requests and for main, never for other branch or tag pushes, and a newer push to the same pull request cancels the
# run it replaces.
#
# The checks themselves are package.json's: `npm run check:fast`, the same a developer's commit runs, then the plugin's
# tests. The security scanners (gitleaks, actionlint, zizmor) are not Node tools, so the `scan` job runs each by its
# official action; locally `npm run scan` runs whichever of them is installed. See CONTRIBUTING.md.
#
# On main, a green check then runs release-please, so nothing is released from a red main. It keeps one pull request
# open that would release what has landed since the last release: the next version, worked out from the commit
# messages, and the changelog. Merging that pull request is the release: it raises `version` in
# .claude-plugin/plugin.json, which is what makes Claude Code offer installed copies the update, and the release job
# then tags it and publishes the GitHub release. Its settings are release-please-config.json; the last released version
# is .release-please-manifest.json. That pull request is opened with GITHUB_TOKEN, so no checks run on it; they run
# once it is merged.
#
# What a team can pin is not this repository but the tree tools/release_tree.ts builds from the allowlist release/files:
# the plugin and nothing else. A pull request builds it, validates it and checks that every module it loads is in it, so
# a broken tree fails there and not at a release. The publish job then commits the tree of a new version to the
# `release` branch, one commit and one `plugin-v<version>` tag per version, never forced.
# See CONTRIBUTING.md, Releasing.
name: check
on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-checks a renamed pull request's title; other edits are skipped below.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  # A body-only edit runs nothing, so it waits in a group of its own: in the shared one it would cancel the real check.
  group: check-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.title && '-body' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: "2.1.318"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the address check reads every commit
      # Every commit names its author by a GitHub noreply address, so no one's own address is published here. The
      # committer is one too, or Claude's noreply@anthropic.com for a commit Claude made and signed. It reads the pull request's own commits, not the merge GitHub makes to test them, and on main the whole
      # history, which also catches a merge GitHub made with a merger's own address.
      - name: Commits carry noreply addresses only
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          exposed=$(git log --format='%h %ae %ce' "$TIP" \
            | grep -vE '^[0-9a-f]+ [^ ]+@users\.noreply\.github\.com ([^ ]+@users\.noreply\.github\.com|noreply@github\.com|noreply@anthropic\.com)$' || true)
          if [ -n "$exposed" ]; then
            echo "::error::These commits name an address other than a GitHub noreply one. Set git's user.email to the noreply address at https://github.com/settings/emails and amend them."
            echo "$exposed" | cut -d' ' -f1
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # zizmor: ignore[adhoc-packages] one pinned CLI
      - run: npm ci --ignore-scripts
      # File hygiene, lint, all the type-checks, the GitLab types, the release tree and `claude plugin validate --strict`
      # of the plugin and of the dev-only store probe.
      - run: npm run check:fast
      # A squash merge makes the pull request's title the commit on main, so it follows the same rule as a commit message.
      - name: The pull request title says what the change is
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npm run --silent pr-title
      - run: npm test
      - name: The release tree builds, validates and loads only what it holds
        run: |
          node tools/release_tree.ts build "$RUNNER_TEMP/tree"
          claude plugin validate --strict "$RUNNER_TEMP/tree"
          claude plugin validate --strict "$RUNNER_TEMP/tree/.claude-plugin/marketplace.json"
          claude plugin validate --strict .claude-plugin/marketplace.json

  # The scanners that are not Node tools, each by its official action, pinned to a commit. They install nothing and read the
  # checkout, with its history.
  scan:
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists a pull request's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request's commits, or the commits a push brought; canary.yml reads the whole history every week.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      # actionlint has no action of its own; its maintainer publishes the image its documentation runs, pinned here by digest.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  release:
    needs: [check, scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two quick pushes must not both publish: the second waits for the first.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # When release-please made a release, puts the plugin's tree at that tag on the `release` branch. It builds from the
  # tag and not from main, which may hold changes that are not released yet. Re-running the job after a success changes
  # nothing, and after a failure publishes the same release again.
  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two publishes must not race for the branch: the second waits for the first.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLAUDE_CODE_VERSION: "2.1.318"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      # release_tree.ts imports nothing from npm, so there is no `npm ci` here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # zizmor: ignore[adhoc-packages] one pinned CLI
      - name: Commit the tree to the release branch
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node tools/release_tree.ts build "$RUNNER_TEMP/tree"
          # What is published passes the same validation as a pull request's tree.
          claude plugin validate --strict "$RUNNER_TEMP/tree"
          claude plugin validate --strict "$RUNNER_TEMP/tree/.claude-plugin/marketplace.json"
          version=$(jq -r .version "$RUNNER_TEMP/tree/.claude-plugin/plugin.json")
          test "v${version}" = "$TAG"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # `refs/heads/release` exactly: a bare `release` also matches a branch such as `x/release`.
          if git ls-remote --exit-code --heads "$url" refs/heads/release > /dev/null; then
            git clone --quiet --branch release --single-branch "$url" "$RUNNER_TEMP/release"
          else
            git init --quiet --initial-branch release "$RUNNER_TEMP/release"
          fi
          from=$(git rev-parse HEAD)
          cd "$RUNNER_TEMP/release"
          git rm -rq --ignore-unmatch .
          cp -a "$RUNNER_TEMP/tree/." .
          git add --all
          tagged=false
          if git ls-remote --exit-code --tags "$url" "refs/tags/plugin-${TAG}" > /dev/null; then
            tagged=true
          fi
          if git diff --cached --quiet; then
            # The branch already holds this tree: a re-run after a successful publish, or after one that lost only the tag.
            if [ "$tagged" = true ]; then
              echo "::notice::plugin-${TAG} is already published and the release branch holds its tree; nothing to do."
              exit 0
            fi
            git tag "plugin-${TAG}"
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push "$url" "refs/tags/plugin-${TAG}"
            exit 0
          fi
          if [ "$tagged" = true ]; then
            echo "::error::plugin-${TAG} exists, but the release branch does not hold this tree. A tag is never moved."
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "release: ${TAG}" -m "The plugin's files at ${GITHUB_REPOSITORY}@${from}, built by tools/release_tree.ts."
          git tag "plugin-${TAG}"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push --atomic "$url" release "refs/tags/plugin-${TAG}"
